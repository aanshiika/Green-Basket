<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login - Green Basket</title>

  <style>
    *{  
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-image: url(image2.jpg);
      background-repeat: no-repeat;
      background-size: cover;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      background: white;
      padding: 2.5rem 2rem;
      border-radius: 12px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.12);
      width: 100%;
      max-width: 420px;
      transition: box-shadow 0.3s ease;
    }
    .login-container:hover {
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    h2 {
      text-align: center;
      margin-bottom: 2rem;
      color: #28a745;
      font-weight: 700;
      letter-spacing: 1.5px;
    }

    .form-group {
      margin-bottom: 1.25rem;
      position: relative;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
      color: #333;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 40px 12px 12px;
      border: 1.5px solid #ccc;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.3s ease;
    }
    input[type="email"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: #28a745;
      box-shadow: 0 0 5px #28a745aa;
    }

    /* Show/Hide password toggle button */
    .toggle-password {
      position: absolute;
      right: 12px;
      top: 37px;
      cursor: pointer;
      user-select: none;
      font-size: 1.1rem;
      color: #666;
      transition: color 0.3s ease;
    }
    .toggle-password:hover {
      color: #28a745;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #28a745;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      transition: background-color 0.3s ease;
    }
    button:hover:not(:disabled) {
      background-color: #218838;
    }
    button:disabled {
      background-color: #94d3a2;
      cursor: not-allowed;
    }

    .message {
      margin-top: 1rem;
      text-align: center;
      font-weight: 600;
      font-size: 1rem;
      min-height: 24px;
      opacity: 0;
      transition: opacity 0.4s ease;
    }
    .message.show {
      opacity: 1;
    }
    .message.success {
      color: #28a745;
    }
    .message.error {
      color: #e03e3e;
    }

    /* Email validation error */
    .email-error {
      color: #e03e3e;
      font-size: 0.875rem;
      margin-top: 4px;
      height: 18px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .email-error.show {
      opacity: 1;
    }

    /* Password strength bar */
    .strength-bar {
      height: 6px;
      border-radius: 6px;
      background-color: #eee;
      margin-top: 6px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      width: 0;
      transition: width 0.4s ease;
    }
    .strength-weak {
      background-color: #e03e3e;
      width: 33%;
    }
    .strength-medium {
      background-color: #f0ad4e;
      width: 66%;
    }
    .strength-strong {
      background-color: #28a745;
      width: 100%;
    }

    .extra-links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.9rem;
      color: #555;
    }
    .extra-links a {
      text-decoration: none;
      color: #007bff;
      transition: color 0.3s ease;
    }
    .extra-links a:hover {
      text-decoration: underline;
      color: #0056b3;
    }

    /* Loading spinner for button */
    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-top: 3px solid white;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }

    /* Responsive */
    @media (max-width: 480px) {
      .login-container {
        padding: 1.5rem 1rem;
      }
    }
  </style>
</head>
<body>
</div>
  <div class="login-container" role="main" aria-label="Login Form">
    <h2>Green Basket Login</h2>
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" aria-describedby="emailHelp" required placeholder="you@example.com" />
        <div id="emailHelp" class="email-error" aria-live="polite"></div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password" aria-describedby="passwordStrength" />
        <span class="toggle-password" id="togglePassword" role="button" tabindex="0" aria-label="Toggle password visibility">👁</span>
        <div class="strength-bar" aria-hidden="true">
          <div id="strengthFill" class="strength-fill"></div>
        </div>
      </div>

      <div class="checkbox-group">
        <input type="checkbox" id="rememberMe" />
        <label for="rememberMe">Remember me</label>
      </div>

      <button type="submit" id="loginBtn" aria-live="polite">Login</button>
      <div id="message" class="message" role="alert" aria-live="assertive"></div>
    </form>

    <div class="extra-links">
      <p>Don't have an account? <a href="register.htm">Register</a></p>
    </div>
  </div>

  <script>
    const loginForm = document.getElementById('loginForm');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const message = document.getElementById('message');
    const togglePassword = document.getElementById('togglePassword');
    const strengthFill = document.getElementById('strengthFill');
    const emailHelp = document.getElementById('emailHelp');
    const loginBtn = document.getElementById('loginBtn');

    // Show/hide password toggle
    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.textContent = type === 'password' ? '👁' : '🙈';
    });
    togglePassword.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        togglePassword.click();
      }
    });

    // Email validation regex
    function validateEmail(email) {
      const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      return re.test(email);
    }

    // Password strength check
    function checkPasswordStrength(password) {
      let strength = 0;
      if (password.length >= 8) strength++;
      if (/[A-Z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[^A-Za-z0-9]/.test(password)) strength++;
      return strength;
    }

    emailInput.addEventListener('input', () => {
      const email = emailInput.value.trim();
      if (email === '') {
        emailHelp.textContent = '';
        emailHelp.classList.remove('show');
      } else if (!validateEmail(email)) {
        emailHelp.textContent = 'Please enter a valid email address.';
        emailHelp.classList.add('show');
      } else {
        emailHelp.textContent = '';
        emailHelp.classList.remove('show');
      }
    });

    passwordInput.addEventListener('input', () => {
      const password = passwordInput.value;
      const strength = checkPasswordStrength(password);
      strengthFill.className = 'strength-fill';
      if (password === '') {
        strengthFill.style.width = '0';
      } else if (strength <= 1) {
        strengthFill.classList.add('strength-weak');
      } else if (strength === 2 || strength === 3) {
        strengthFill.classList.add('strength-medium');
      } else {
        strengthFill.classList.add('strength-strong');
      }
    });

    loginForm.addEventListener('submit', e => {
      e.preventDefault();

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      // Clear previous messages
      message.textContent = '';
      message.className = 'message';

      // Basic validation
      if (!validateEmail(email)) {
        message.textContent = 'Please enter a valid email address.';
        message.classList.add('error', 'show');
        emailInput.focus();
        return;
      }
      if (password.length < 6) {
        message.textContent = 'Password must be at least 6 characters.';
        message.classList.add('error', 'show');
        passwordInput.focus();
        return;
      }

      // Disable button and show loading spinner
      loginBtn.disabled = true;
      loginBtn.innerHTML = 'Logging in <span class="spinner" aria-hidden="true"></span>';

      // Simulate server request delay (e.g., 2 seconds)
      setTimeout(() => {
        // Dummy login validation: accept any credentials or you can keep your old check here
        if(email === "anshikatripathi1110@gmail.com" && password === "123456") {
          message.textContent = 'Login successful! Redirecting...';
          message.classList.remove('error');
          message.classList.add('success', 'show');

          // Enable button
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';

          // Redirect to newgrocerystore.html after short delay
          setTimeout(() => {
            window.location.href = 'products.htm';
          }, 1500);

        } else {
          message.textContent = 'Invalid email or password.';
          message.classList.add('error', 'show');

          // Enable button
          loginBtn.disabled = false;
          loginBtn.textContent = 'Login';
        }
      }, 2000);
    });


  </script>


</body>
</html>
