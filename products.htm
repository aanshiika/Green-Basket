  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Arial, sans-serif; background-color: #f7f7f7; color: #222; }

    header {
      background-image: url(backimg.jpg);
      background-color: #4CAF50;
      color: white;
      padding: 1em;
      text-align: center;
    }

    .container { padding: 20px; max-width: 1200px; margin: 0 auto; }

    /* Filter Panel */
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 15px 0;
      align-items: center;
    }
    .filters input[type="text"], .filters select {
      padding: 10px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      min-width: 140px;
    }
    .filters .priceWrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .price-label { margin-left: 6px; font-weight: bold; }

    /* Product Grid */
    .products {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-start;
      gap: 20px;
      margin-top: 20px;
    }
    .product {
      background: white;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      width: 260px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.15s, box-shadow 0.15s;
      position: relative;
    }
    .product:hover { transform: translateY(-6px); box-shadow: 0 8px 20px rgba(0,0,0,0.08); }

    .product img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .product h4 { font-size: 1.05rem; margin-bottom: 6px; color: #222; }
    .product p { font-size: 0.98rem; margin-bottom: 8px; color: #555; }

    /* Checkbox in corner */
    .select-box {
      position: absolute;
      left: 10px;
      top: 10px;
      transform: scale(1.15);
      cursor: pointer;
    }

    /* quantity and add-to-cart */
    .qty {
      width: 70px;
      padding: 6px;
      font-size: 0.95rem;
      margin-right: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
      text-align: center;
    }
    .add-btn {
      background: #4CAF50;
      color: white;
      border: none;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.95rem;
    }
    .add-btn:hover { background: #388E3C; }

    /* Toast */
    #toast {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #323232;
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity .2s, transform .2s;
      z-index: 1000;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* View Cart floating button */
    .view-cart {
      position: fixed;
      right: 20px;
      top: 100px;
      background: #1976D2;
      color: white;
      padding: 12px 14px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(25,118,210,0.18);
      z-index: 1000;
    }
    .view-cart:hover { background: #115293; }

    /* No results */
    .no-results {
      font-size: 1.25rem;
      color: #c62828;
      padding: 30px;
      text-align: center;
      width: 100%;
    }

    /* Responsive */
    @media (max-width: 800px) {
      .product { width: 45%; }
      .filters { gap: 8px; }
    }
    @media (max-width: 480px) {
      .product { width: 100%; }
      .filters { flex-direction: column; align-items: stretch; }
      .view-cart { top: auto; bottom: 90px; }
    }
  </style>
</head>

/* localStorage cart helpers (format used by your cart.htm & payment.htm) */
function getCart() {
  try {
    return JSON.parse(localStorage.getItem('cart')) || [];
  } catch (e) { return []; }
}
function saveCart(cart) {
  localStorage.setItem('cart', JSON.stringify(cart));
}

/* shortcuts to DOM */
const searchBar = document.getElementById('searchBar');
const categoryFilter = document.getElementById('categoryFilter');
const priceRange = document.getElementById('priceRange');
const priceValue = document.getElementById('priceValue');
const sortBy = document.getElementById('sortBy');
const productList = document.getElementById('productList');
const toast = document.getElementById('toast');

/* selected items tracking (checkboxes) */
let selectedItems = new Set();

/* escape helper */
function escapeHtml(text) {
  return String(text)
    .replaceAll('&', '&amp;')
    .replaceAll('<', '&lt;')
    .replaceAll('>', '&gt;')
    .replaceAll('"', '&quot;')
    .replaceAll("'", '&#039;');
}

/* render product cards (with qty input + add to cart) */
function renderProducts(list) {
  productList.innerHTML = '';

  if (!list || list.length === 0) {
    productList.innerHTML = `<div class="no-results">No such product available</div>`;
    return;
  }

  const html = list.map(p => {
    const safeName = encodeURIComponent(p.name);
    const checked = selectedItems.has(p.name) ? 'checked' : '';
    return `
      <div class="product" data-name="${escapeHtml(p.name)}" data-category="${p.category}">
        <input type="checkbox" class="select-box" data-name="${escapeHtml(p.name)}" ${checked} title="Select ${escapeHtml(p.name)}">
        <img src="${p.image}" alt="${escapeHtml(p.name)}">
        <h4>${escapeHtml(p.name)}</h4>
        <p>₹${p.price} <span style="font-size:0.85em; color:#777;">${p.unit || ''}</span></p>


        <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px;">
          <input type="number" min="0" value="0" id="qty-${safeName}" class="qty" title="Quantity (0 to any)">
          <button class="add-btn" data-name="${escapeHtml(p.name)}" data-price="${p.price}">Add to Cart</button>
        </div>
      </div>
    `;
  }).join('');

  productList.innerHTML = html;

  // attach checkbox listeners
  document.querySelectorAll('.select-box').forEach(box => {
    box.addEventListener('change', function() {
      const nm = this.dataset.name;
      if (this.checked) selectedItems.add(nm); else selectedItems.delete(nm);
    });
  });

  // attach add-to-cart listeners
  document.querySelectorAll('.add-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      const name = this.dataset.name;
      const price = Number(this.dataset.price);
      const safeName = encodeURIComponent(name);
      const qtyInput = document.getElementById('qty-' + safeName);
      let qty = Number(qtyInput.value);
      if (!Number.isFinite(qty) || qty <= 0) {
        alert('Enter quantity (must be a number > 0) to add to cart.');
        return;
      }
      addToCart(name, price, qty);
      qtyInput.value = '0'; // reset input
      showToast(`${name} × ${qty} added to cart`);
    });
  });
}

/* Apply search/category/price/sort & render */
function applyFilters() {
  let filtered = products.slice();

  // search
  const q = searchBar.value.trim().toLowerCase();
  if (q) filtered = filtered.filter(p => p.name.toLowerCase().includes(q));

  // category (dropdown limited to original 5)
  const cat = categoryFilter.value;
  if (cat !== 'all') filtered = filtered.filter(p => p.category === cat);

  // price
  const maxPrice = Number(priceRange.value);
  filtered = filtered.filter(p => p.price <= maxPrice);
  priceValue.textContent = '₹' + maxPrice;

  // sort
  const s = sortBy.value;
  if (s === 'lowToHigh') filtered.sort((a,b) => a.price - b.price);
  else if (s === 'highToLow') filtered.sort((a,b) => b.price - a.price);
  else if (s === 'nameAsc') filtered.sort((a,b) => a.name.localeCompare(b.name));
  else if (s === 'selectedOnly') filtered = filtered.filter(p => selectedItems.has(p.name));

  renderProducts(filtered);
}

/* Add to cart function: merges quantities if item exists */
function addToCart(name, price, qty) {
  const cart = getCart();
  const idx = cart.findIndex(item => item.name === name);
  if (idx >= 0) {
    cart[idx].quantity = Number(cart[idx].quantity) + Number(qty);
  } else {
    // include image for nicer display in cart/payment (optional)
    const prod = products.find(p => p.name === name);
    cart.push({ name, price: Number(price), quantity: Number(qty), image: prod ? prod.image : '' });
  }
  saveCart(cart);
}

/* Toast helper */
let toastTimer = null;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.remove('show');
  }, 1800);
}

/* Init */
renderProducts(products);
priceValue.textContent = '₹' + priceRange.value;

/* Event listeners */
searchBar.addEventListener('input', applyFilters);
categoryFilter.addEventListener('change', applyFilters);
priceRange.addEventListener('input', applyFilters);
sortBy.addEventListener('change', applyFilters);

/* Make sure cart in localStorage exists as array (so cart/payment pages parse smoothly) */
if (!Array.isArray(getCart())) saveCart([]);
</script>
