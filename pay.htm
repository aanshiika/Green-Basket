<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green Basket - Secure Payment</title>

<style>
body {
    background-image: url(backimg.jpg);
    font-family: Arial, sans-serif;
    margin: 0;
    padding: 0;
    background-size: cover;
}

header {
    background: #4CAF50;
    padding: 15px;
    text-align: center;
    color: white;
    font-size: 24px;
}

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 20px;
    display: flex;
    gap: 20px;
}

.summary, .payment {
    flex: 1;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
}

.summary h3, .payment h3 {
    margin-bottom: 15px;
    color: #333;
}

.item {
    display: flex;
    align-items: center;
    margin-bottom: 12px;
    border-bottom: 1px solid #ddd;
    padding-bottom: 10px;
}

.item img {
    width: 60px;
    height: 60px;
    border-radius: 8px;
    margin-right: 10px;
}

.total-box {
    margin-top: 20px;
    padding-top: 15px;
    border-top: 2px solid #ccc;
    font-size: 18px;
}

.price-line {
    display: flex;
    justify-content: space-between;
}

.method {
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
    cursor: pointer;
}

.method.active {
    border-color: #4CAF50;
    background: #e8f5e9;
}

.hidden { display: none; }

input {
    width: 100%;
    padding: 12px;
    border: 1px solid #bbb;
    font-size: 15px;
    margin-top: 10px;
    border-radius: 6px;
}

button {
    width: 100%;
    background: #4CAF50;
    color: white;
    padding: 14px;
    font-size: 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 15px;
}

button:hover {
    background: #3a8c40;
}

/* Success Popup */
#successBox {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 25px 35px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 3px 20px rgba(0,0,0,0.3);
    display: none;
    z-index: 9999;
}
</style>
</head>

<body>

<header>Secure Checkout — Green Basket</header>

<div class="container">

<!-- ORDER SUMMARY -->
<div class="summary">
    <h3>Your Order Summary</h3>
    <div id="orderList"></div>

    <div class="total-box">
        <div class="price-line">
            <span>Subtotal:</span>
            <span>₹<span id="subtotal">0</span></span>
        </div>
        <div class="price-line">
            <span>Delivery Fee:</span>
            <span>₹40</span>
        </div>
        <div class="price-line" style="font-weight:bold;font-size:20px;">
            <span>Total:</span>
            <span>₹<span id="finalTotal">0</span></span>
        </div>
    </div>
</div>

<!-- PAYMENT -->
<div class="payment">
    <h3>Select Payment Method</h3>

    <div class="method" onclick="selectMethod('card')">💳 Card</div>
    <div class="method" onclick="selectMethod('upi')">⚡ UPI</div>
    <div class="method" onclick="selectMethod('cod')">📦 Cash on Delivery</div>

    <div id="cardBox" class="hidden">
        <input id="name" placeholder="Name on Card">
        <input id="cardNumber" placeholder="Card Number">
        <input id="expiry" placeholder="Expiry (MM/YY)">
        <input id="cvv" placeholder="CVV">
    </div>

    <div id="upiBox" class="hidden">
        <input id="upiID" placeholder="example@upi">
    </div>

    <div id="codBox" class="hidden">
        <p>You will pay when order arrives.</p>
    </div>

    <button onclick="placeOrder()">Place Order</button>
</div>
</div>

<!-- SUCCESS -->
<div id="successBox">
    <h2>🎉 Payment Successful!</h2>
    <p>Your order has been placed.</p>
    <button onclick="finish()">Go to Dashboard</button>
</div>

<script>
let selectedMethod = null;

/* PAYMENT METHOD */
function selectMethod(method) {
    selectedMethod = method;
    document.querySelectorAll('.method').forEach(m => m.classList.remove('active'));
    event.target.classList.add('active');

    cardBox.classList.add('hidden');
    upiBox.classList.add('hidden');
    codBox.classList.add('hidden');

    if (method === 'card') cardBox.classList.remove('hidden');
    if (method === 'upi') upiBox.classList.remove('hidden');
    if (method === 'cod') codBox.classList.remove('hidden');
}

/* LOAD CART */
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let subtotal = 0;

cart.forEach(item => {
    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
        <img src="${item.image}">
        <div>
            <strong>${item.name}</strong><br>
            Qty: ${item.quantity} × ₹${item.price}
        </div>`;
    orderList.appendChild(div);
    subtotal += item.price * item.quantity;
});

subtotalEl = document.getElementById("subtotal");
finalTotalEl = document.getElementById("finalTotal");
subtotalEl.innerText = subtotal.toFixed(2);
finalTotalEl.innerText = (subtotal + 40).toFixed(2);

/* PLACE ORDER (FIXED) */
function placeOrder() {

    if (!selectedMethod) {
        alert("Please select payment method");
        return;
    }

    if (cart.length === 0) {
        alert("No items in cart");
        return;
    }

    // ✅ SAVE ORDER FOR DASHBOARD
    localStorage.setItem("orders", JSON.stringify(cart));

    // ✅ CLEAR CART
    localStorage.removeItem("cart");

    // SHOW SUCCESS
    successBox.style.display = "block";
}

/* REDIRECT */
function finish() {
    window.location.href = "dashboard.htm";
}
</script>

</body>
</html>
